# testes do motor numa máquina Windows: o Ilusio para Windows usa o mesmo teleporte.py
name: windows

on:
  pull_request:
  push:
    branches: [main]
  # depois do scripts/release.sh (Mac): anexa o instalador à mesma release, ainda em rascunho
  workflow_dispatch:
    inputs:
      version:
        description: "Versão da release (ex.: 0.1.1)"
        required: true

# o job só lê o repositório: dependência comprometida não ganha escrita pelo token
permissions:
  contents: read

jobs:
  motor:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependências
        run: python -m pip install -r requirements.txt
      - name: Som (ffmpeg)
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress }
          python tools/preparar_som.py
      - name: Testes do motor
        run: python -m unittest discover -s tests -v

  app:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependências
        run: python -m pip install -r requirements.txt -r windows/requirements.txt
      - name: Testes do app
        run: python -m unittest discover -s windows/tests -v

  instalador:
    runs-on: windows-latest
    env:
      VERSION_INPUT: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependências
        run: python -m pip install -r requirements.txt -r windows/requirements.txt -r requirements-dev.txt pillow==12.0.0
      - name: Som (ffmpeg)
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress }
          python tools/preparar_som.py
      - name: Versão
        shell: pwsh
        run: |
          $init = "windows/ilusio_win/__init__.py"
          if ($env:VERSION_INPUT) {
            if ($env:VERSION_INPUT -notmatch '^\d+\.\d+\.\d+$') { throw "versão inválida: $env:VERSION_INPUT" }
            (Get-Content $init -Raw) -replace '__version__ = "[^"]*"', "__version__ = `"$env:VERSION_INPUT`"" | Set-Content $init -NoNewline
          }
          $v = (Select-String -Path $init -Pattern '__version__ = "([^"]+)"').Matches[0].Groups[1].Value
          "VERSION=$v" >> $env:GITHUB_ENV
      - name: App (PyInstaller --onedir)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          python -c "from PIL import Image; Image.open('app/Ilusio/Assets.xcassets/AppIcon.appiconset/icon_256x256.png').save('build/ilusio.ico', sizes=[(16,16),(32,32),(48,48),(256,256)])"
          python -m PyInstaller --noconfirm --clean --log-level WARN --onedir --windowed --name Ilusio `
            --icon "$PWD\build\ilusio.ico" --distpath "$PWD\build\dist" --workpath "$PWD\build\work" --specpath "$PWD\build" `
            --paths "$PWD" --paths "$PWD\windows" --collect-data mediapipe --collect-binaries mediapipe `
            --add-data "$PWD\sons\teleport.wav;sons" --exclude-module tkinter --exclude-module matplotlib `
            windows\ilusio_win\__main__.py
      - name: O executável abre (som e modelos)
        shell: pwsh
        run: |
          $p = Start-Process build\dist\Ilusio\Ilusio.exe -ArgumentList "--check" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Ilusio.exe --check saiu com $($p.ExitCode)" }
      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /Q "/DVersion=$env:VERSION" windows\installer\ilusio.iss
          if ($LASTEXITCODE) { throw "iscc falhou" }
          $exe = "build\installer\Ilusio-Setup-$env:VERSION.exe"
          "$((Get-FileHash $exe -Algorithm SHA256).Hash.ToLower())  Ilusio-Setup-$env:VERSION.exe" | Set-Content "$exe.sha256" -NoNewline
      - uses: actions/upload-artifact@v4
        with:
          name: instalador
          path: build/installer/
          retention-days: 7

  # só no disparo manual, e só este job escreve no repositório
  publicar:
    if: github.event_name == 'workflow_dispatch'
    needs: [motor, app, instalador]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: instalador
      - name: Anexar à release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_INPUT: ${{ inputs.version }}
        run: gh release upload "v$VERSION_INPUT" Ilusio-Setup-* --clobber --repo "$GITHUB_REPOSITORY"
