name: Ilusio
options:
  bundleIdPrefix: com.mvtiburcio
  deploymentTarget:
    macOS: "26.0"
packages:
  Sparkle:  # atualização automática (verifica, baixa, troca o app no lugar e reabre)
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
configFiles:
  Debug: Base.xcconfig
  Release: Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ARCHS: arm64
targets:
  Ilusio:
    type: application
    platform: macOS
    sources: [Ilusio]
    info:
      path: Ilusio/Info.plist
      properties:
        CFBundleDisplayName: Ilusio
        CFBundleShortVersionString: $(MARKETING_VERSION)  # sem isto o XcodeGen grava "1.0" fixo
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.entertainment
        CFBundleDevelopmentRegion: pt-BR
        CFBundleLocalizations: [pt-BR]  # sem isto o Sparkle (e outros diálogos do sistema) aparece em inglês
        NSCameraUsageDescription: O Ilusio usa a câmera para reconhecer o gesto e aplicar o efeito.
        NSMicrophoneUsageDescription: O Ilusio mistura o seu microfone com o som do teletransporte para a chamada ouvir.
        IlusioRepoDir: $(ILUSIO_REPO_DIR)
        PixKey: $(PIX_KEY)
        PixName: $(PIX_NAME)
        PixCity: $(PIX_CITY)
        # Sparkle: o feed sai como asset de cada release (release.sh); a chave pública confere a assinatura
        # EdDSA do .dmg (a privada fica no Keychain de quem gera o release)
        SUFeedURL: https://github.com/mvtiburcio/teleporte-instantaneo/releases/latest/download/appcast.xml
        SUPublicEDKey: lZ5z8s/G0BHd0ag5Ixy/zNQTUeAi5dFWvog+ANMPE2s=
        SUEnableAutomaticChecks: true
        NSSystemExtensionUsageDescription: A câmera do Ilusio entrega o vídeo com o efeito para a chamada.
    entitlements:
      path: Ilusio/Ilusio.entitlements
      properties:
        com.apple.developer.system-extension.install: true
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)com.mvtiburcio.ilusio]
        # hardened runtime (exigido pela notarização) bloqueia câmera e microfone sem estes
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
    dependencies:
      - target: IlusioCamera
        embed: true
      - package: Sparkle
    postCompileScripts:
      - name: Embutir o Ilusio Mic
        # driver de áudio próprio (BlackHole GPL-3 renomeado); compilado uma vez por IlusioMic/build.sh
        script: |
          set -e
          driver="$SRCROOT/IlusioMic/build/out/IlusioMic.driver"
          [ -d "$driver" ] || "$SRCROOT/IlusioMic/build.sh" "${EXPANDED_CODE_SIGN_IDENTITY:--}"  # mesma assinatura do app
          mkdir -p "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          rm -rf "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/IlusioMic.driver"
          ditto "$driver" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/IlusioMic.driver"
        basedOnDependencyAnalysis: false
      - name: Embutir o motor (Release)
        # Release leva o motor congelado (tools/congelar_motor.sh); Debug usa o .venv do repositório
        script: |
          set -e
          [ "$CONFIGURATION" = Release ] || exit 0
          engine="$SRCROOT/../build/engine/dist/ilusio-engine"
          [ -x "$engine/ilusio-engine" ] || { echo "error: motor não congelado: rode tools/congelar_motor.sh"; exit 1; }
          fontes=$(cd "$SRCROOT/.." && shasum -a 256 teleporte.py ipc.py requirements.txt sons/teleport.wav | shasum -a 256 | cut -d' ' -f1)
          [ "$(cat "$engine/.fontes" 2>/dev/null)" = "$fontes" ] || { echo "error: motor desatualizado: rode tools/congelar_motor.sh"; exit 1; }
          dest="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/engine"
          rm -rf "$dest" && mkdir -p "$dest"
          ditto "$engine" "$dest"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mvtiburcio.ilusio
        # doação (aba Apoiar): chave Pix aleatória, pública por natureza
        PIX_KEY: d1fef5be-4e51-4a50-86fb-8810cb8bfcd4
        PIX_NAME: ILUSIO
        PIX_CITY: RECIFE
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO  # o script acima copia o driver pra dentro do app
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Debug:
          ILUSIO_REPO_DIR: $(SRCROOT)/..
        Release:
          ILUSIO_REPO_DIR: ""
    scheme:
      testTargets: [IlusioTests]
  IlusioCamera:
    # câmera virtual "Ilusio Camera": recebe os frames do app (sink) e entrega pra chamada (source)
    type: system-extension
    platform: macOS
    sources: [IlusioCamera]
    info:
      path: IlusioCamera/Info.plist
      properties:
        CFBundleDisplayName: Ilusio Camera
        # SYSX: é por este tipo que o macOS reconhece uma system extension (o Info.plist gerado não trazia)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        NSSystemExtensionUsageDescription: A câmera do Ilusio entrega o vídeo com o efeito para a chamada.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)  # a versão que o macOS compara pra trocar a extensão
        CMIOExtension:
          CMIOExtensionMachServiceName: $(TeamIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
    entitlements:
      path: IlusioCamera/IlusioCamera.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)com.mvtiburcio.ilusio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mvtiburcio.ilusio.camera
        # o macOS só acha a extensão se o arquivo for <bundle id>.systemextension
        PRODUCT_NAME: $(PRODUCT_BUNDLE_IDENTIFIER)
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
  IlusioTests:
    type: bundle.unit-test
    platform: macOS
    sources: [IlusioTests]
    dependencies:
      - target: Ilusio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
